{% set name = "quasiqueue" %}
{% set version = "0.6.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/quasiqueue-{{ version }}.tar.gz
  sha256: f7a258b61ab79b763b3a73466b3722f21f05f58f81f5ef9fde807883282e5390

build:
  entry_points:
    - quasiqueue = quasiqueue.cli:app
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=67.0
    - setuptools-scm >=7.1
    - pip
  run:
    - python >={{ python_min }}
    - psutil
    - pydantic >=2.0,<3.dev0
    - pydantic-settings
    - typer >=0.9.0

test:
  imports:
    - quasiqueue
  commands:
    - pip check
    - quasiqueue --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/tedivm/quasiqueue
  summary: A Simple High Performance Multiprocess Queue
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
